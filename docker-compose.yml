services:
  postgres:
    # Official postgis/postgis publishes amd64 only. This image is PostgreSQL 16 with PostGIS 3.5 and has an arm64 build.
    image: imresamu/postgis:16-3.5
    container_name: norilsk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: norilsk_gis
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d norilsk_gis"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer
    container_name: norilsk_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: norilsk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: norilsk_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command: /scripts/minio-init.sh
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BUCKET: norilsk-media
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro

  backend:
    build: .
    container_name: norilsk_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      CORS_ORIGIN: http://localhost:5173,http://localhost
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: admin
      DB_PASSWORD: secret
      DB_NAME: norilsk_gis
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: norilsk-media
      MINIO_USE_SSL: "false"
      MODERATOR_LOGIN: moderator
      MODERATOR_PASSWORD: moderator-change-me
      MODERATOR_FULL_NAME: Модератор
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../gis-frontend
      dockerfile: Dockerfile
    container_name: norilsk_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  minio_data:
