basePath: /
definitions:
  applications.applicationRequest:
    properties:
      body:
        type: string
    type: object
  applications.decisionRequest:
    properties:
      decision:
        type: string
      role:
        type: string
    type: object
  applications.errorResponse:
    properties:
      error:
        type: string
    type: object
  applications.publicApplication:
    properties:
      assigned_role:
        $ref: '#/definitions/applications.publicRole'
      body:
        type: string
      created_at:
        type: string
      decision:
        type: string
      full_name:
        type: string
      id:
        type: integer
      login:
        type: string
    type: object
  applications.publicRole:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  applications.reviewQueue:
    properties:
      applications:
        items:
          $ref: '#/definitions/applications.publicApplication'
        type: array
      roles:
        items:
          $ref: '#/definitions/applications.publicRole'
        type: array
