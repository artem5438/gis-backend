basePath: /
definitions:
  applications.applicationRequest:
    properties:
      body:
        type: string
    type: object
  applications.decisionRequest:
    properties:
      decision:
        type: string
      role:
        type: string
    type: object
  applications.errorResponse:
    properties:
      error:
        type: string
    type: object
  applications.publicApplication:
    properties:
      assigned_role:
        $ref: '#/definitions/applications.publicRole'
      body:
        type: string
      created_at:
        type: string
      decision:
        type: string
      full_name:
        type: string
      id:
        type: integer
      login:
        type: string
    type: object
  applications.publicRole:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  applications.reviewQueue:
    properties:
      applications:
        items:
          $ref: '#/definitions/applications.publicApplication'
        type: array
      roles:
        items:
          $ref: '#/definitions/applications.publicRole'
        type: array
    type: object
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  auth.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  auth.publicRole:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  auth.publicUser:
    properties:
      from_database:
        type: boolean
      full_name:
        type: string
      id:
        type: integer
      login:
        type: string
      role:
        $ref: '#/definitions/auth.publicRole'
      verification_status:
        type: string
    type: object
  auth.registerRequest:
    properties:
      full_name:
        type: string
      login:
        type: string
      password:
        type: string
    type: object
  auth.sourceRequest:
    properties:
      from_database:
        type: boolean
    type: object
  main.healthResponse:
    properties:
      status:
        type: string
    type: object
  parcels.errorResponse:
    properties:
      error:
        type: string
    type: object
  parcels.feature:
    properties:
      geometry:
        type: object
      id:
        type: integer
      properties:
        additionalProperties: {}
        type: object
      type:
        type: string
    type: object
  parcels.featureCollection:
    properties:
      features:
        items:
          $ref: '#/definitions/parcels.feature'
        type: array
      type:
        type: string
    type: object
  parcels.lookupResponse:
    properties:
      found:
        type: boolean
      parcel:
        $ref: '#/definitions/parcels.parcelCard'
    type: object
  parcels.parcelCard:
    properties:
      address:
        type: string
      area_ha:
        type: number
      area_m2:
        type: number
      area_name:
        type: string
      assigned_on:
        type: string
      cadastral_cost:
        type: number
      cadastral_number:
        type: string
      cadastral_quarter:
        type: string
      cost_index:
        type: number
      id:
        type: integer
      land_category:
        type: string
      object_kind:
        type: string
      ownership_form:
        type: string
      parcel_kind:
        type: string
      permitted_use:
        type: string
      status:
        type: string
    type: object
  parcels.pointRequest:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  parcels.walkStatus:
    properties:
      left:
        type: integer
      message:
        type: string
      saved:
        type: integer
      state:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Запросы сервера. Вход открывает cookie session_id на сутки. Дальнейшие
    запросы ходят с этой cookie.
  title: ГИС Норильска
  version: "1"
paths:
  /api/applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applications.reviewQueue'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Очередь модератора
      tags:
      - заявки
    post:
      consumes:
      - application/json
      parameters:
      - description: Зачем нужна роль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/applications.applicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/applications.publicApplication'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Отправить заявку
      tags:
      - заявки
  /api/applications/{id}/decision:
    post:
      consumes:
      - application/json
      parameters:
      - description: Номер заявки
        in: path
        name: id
        required: true
        type: integer
      - description: approved и код роли, либо rejected
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/applications.decisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applications.decisionRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Решение по заявке
      tags:
      - заявки
  /api/applications/mine:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applications.publicApplication'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Моя заявка
      tags:
      - заявки
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.publicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Вход
      tags:
      - вход
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Выход
      tags:
      - вход
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.publicUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Кто вошёл
      tags:
      - вход
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: ФИО, логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.publicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Регистрация
      tags:
      - вход
  /api/auth/source:
    post:
      consumes:
      - application/json
      parameters:
      - description: Читать карточку из своей базы
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.sourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.publicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Откуда открывать карточку участка
      tags:
      - вход
  /api/catalog/walk:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.walkStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Состояние обхода
      tags:
      - каталог
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.walkStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Собрать каталог
      tags:
      - каталог
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthResponse'
      summary: Проверка сервера
      tags:
      - сервер
  /api/parcels:
    get:
      description: Без краёв окна отдаёт весь город. С краями отдаёт только участки
        внутри прямоугольника. Это прорисовка «Экран» и «Близко».
      parameters:
      - description: Юг окна
        in: query
        name: south
        type: number
      - description: Запад окна
        in: query
        name: west
        type: number
      - description: Север окна
        in: query
        name: north
        type: number
      - description: Восток окна
        in: query
        name: east
        type: number
      - description: Упрощение линии, в градусах
        in: query
        name: simplify
        type: number
      - description: 1 — крупные квадраты вместо контуров
        in: query
        name: squares
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.featureCollection'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Слой участков
      tags:
      - участки
  /api/parcels/at-point:
    post:
      consumes:
      - application/json
      parameters:
      - description: Широта и долгота
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/parcels.pointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.lookupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Участок по щелчку
      tags:
      - участки
  /api/parcels/stored:
    post:
      consumes:
      - application/json
      parameters:
      - description: Широта и долгота
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/parcels.pointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.lookupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Карточка из своей базы
      tags:
      - участки
swagger: "2.0"
