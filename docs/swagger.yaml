  assistant.ParcelSpot:
    properties:
      lat:
        type: number
      lng:
        type: number
      number:
        type: string
    type: object
  assistant.askRequest:
    properties:
      message:
        type: string
    type: object
  assistant.askResponse:
    properties:
      answer:
        type: string
      grades:
        items:
          $ref: '#/definitions/assistant.gradeResponse'
        type: array
      map:
        $ref: '#/definitions/assistant.ParcelSpot'
      sources:
        items:
          $ref: '#/definitions/assistant.sourceResponse'
        type: array
    type: object
  assistant.errorResponse:
    properties:
      error:
        type: string
    type: object
  assistant.gradeResponse:
    properties:
      grade:
        type: string
      number:
        type: integer
      title:
        type: string
    type: object
  assistant.statusResponse:
    properties:
      status:
        type: string
    type: object
  assistant.storedDocument:
    properties:
      author:
        type: string
      can_edit:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      kind:
        type: string
      title:
        type: string
    type: object
  assistant.sourceResponse:
    properties:
      id:
        type: integer
      kind:
        type: string
      title:
        type: string
    type: object
  assistant.titleRequest:
    properties:
      title:
        type: string
    type: object
  assistant.uploadResponse:
    properties:
      chunks:
        type: integer
      id:
        type: integer
      title:
        type: string
    type: object
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  auth.loginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  auth.publicRole:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  auth.publicUser:
    properties:
      from_database:
        type: boolean
      full_name:
        type: string
      id:
        type: integer
      login:
        type: string
      role:
        $ref: '#/definitions/auth.publicRole'
      verification_status:
        type: string
    type: object
  auth.registerRequest:
    properties:
      full_name:
        type: string
      login:
        type: string
      password:
        type: string
    type: object
  auth.sourceRequest:
    properties:
      from_database:
        type: boolean
    type: object
  main.healthResponse:
    properties:
      status:
        type: string
    type: object
  parcels.analyticsCell:
    properties:
      area_ha:
        type: number
      category:
        type: string
      count:
        type: integer
      district:
        type: string
    type: object
  parcels.analyticsResponse:
    properties:
      cells:
        items:
          $ref: '#/definitions/parcels.analyticsCell'
        type: array
    type: object
  parcels.errorResponse:
    properties:
      error:
        type: string
    type: object
  parcels.feature:
    properties:
      geometry:
        type: object
      id:
        type: integer
      properties:
        additionalProperties: {}
        type: object
      type:
        type: string
    type: object
  parcels.featureCollection:
    properties:
      features:
        items:
          $ref: '#/definitions/parcels.feature'
        type: array
      type:
        type: string
    type: object
  parcels.lookupResponse:
    properties:
      found:
        type: boolean
      parcel:
        $ref: '#/definitions/parcels.parcelCard'
    type: object
  parcels.parcelCard:
    properties:
      address:
        type: string
      area_ha:
        type: number
      area_m2:
        type: number
      area_name:
        type: string
      assigned_on:
        type: string
      cadastral_cost:
        type: number
      cadastral_number:
        type: string
      cadastral_quarter:
        type: string
      cost_index:
        type: number
      id:
        type: integer
      land_category:
        type: string
      object_kind:
        type: string
      ownership_form:
        type: string
      parcel_kind:
        type: string
      permitted_use:
        type: string
      score:
        $ref: '#/definitions/parcels.parcelScore'
      status:
        type: string
    type: object
  parcels.parcelScore:
    properties:
      area_ha:
        type: number
      area_max:
        type: number
      area_points:
        type: number
      category:
        type: string
      distance_m:
        type: number
      district:
        type: string
      location_max:
        type: number
      location_points:
        type: number
      median_ha:
        type: number
      ready:
        type: boolean
      reason:
        type: string
      total:
        type: number
    type: object
  parcels.pointRequest:
    properties:
      lat:
        type: number
      lng:
        type: number
    type: object
  parcels.quarterReport:
    properties:
      area_ha:
        type: number
      area_median_ha:
        type: number
      basis:
        type: string
      categories:
        items:
          $ref: '#/definitions/parcels.quarterSlice'
        type: array
      cost_index:
        type: number
      cost_median:
        type: number
      neighbor_count:
        type: integer
      neighbor_numbers:
        items:
          type: string
        type: array
      note:
        type: string
      quarter:
        type: string
      ready:
        type: boolean
      reason:
        type: string
      same_category:
        type: integer
      same_use:
        type: integer
      score:
        type: number
      score_median:
        type: number
      uses:
        items:
          $ref: '#/definitions/parcels.quarterSlice'
        type: array
    type: object
  parcels.quarterSlice:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  parcels.walkStatus:
    properties:
      left:
        type: integer
      message:
        type: string
      saved:
        type: integer
      state:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Запросы сервера. Вход открывает cookie session_id на сутки. Дальнейшие
    запросы ходят с этой cookie.
  title: ГИС Норильска
  version: "1"
paths:
  /api/analytics:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.analyticsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Аналитика каталога
      tags:
      - участки
  /api/applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applications.reviewQueue'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Очередь модератора
      tags:
      - заявки
    post:
      consumes:
      - application/json
      parameters:
      - description: Зачем нужна роль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/applications.applicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/applications.publicApplication'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Отправить заявку
      tags:
      - заявки
  /api/applications/{id}/decision:
    post:
      consumes:
      - application/json
      parameters:
      - description: Номер заявки
        in: path
        name: id
        required: true
        type: integer
      - description: approved и код роли, либо rejected
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/applications.decisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applications.decisionRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/applications.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Решение по заявке
      tags:
      - заявки
  /api/applications/mine:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/applications.publicApplication'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/applications.errorResponse'
      summary: Моя заявка
      tags:
      - заявки
  /api/assistant/ask:
    post:
      consumes:
      - application/json
      parameters:
      - description: Вопрос
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistant.askRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistant.askResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/assistant.errorResponse'
      summary: Вопрос ассистенту
      tags:
      - ассистент
  /api/assistant/documents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/assistant.storedDocument'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/assistant.errorResponse'
      summary: Список документов ассистента
      tags:
      - ассистент
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: txt, md, docx, pdf, xlsx или csv, до 50 МБ
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/assistant.uploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/assistant.errorResponse'
      summary: Загрузка документа ассистента
      tags:
      - ассистент
  /api/assistant/documents/{id}:
    delete:
      parameters:
      - description: Номер документа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistant.statusResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/assistant.errorResponse'
      summary: Удаление документа
      tags:
      - ассистент
    patch:
      consumes:
      - application/json
      parameters:
      - description: Номер документа
        in: path
        name: id
        required: true
        type: integer
      - description: Название
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistant.titleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/assistant.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/assistant.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/assistant.errorResponse'
      summary: Новое название документа
      tags:
      - ассистент
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.publicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Вход
      tags:
      - вход
  /api/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Выход
      tags:
      - вход
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.publicUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Кто вошёл
      tags:
      - вход
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: ФИО, логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.publicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Регистрация
      tags:
      - вход
  /api/auth/source:
    post:
      consumes:
      - application/json
      parameters:
      - description: Читать карточку из своей базы
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.sourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.publicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Откуда открывать карточку участка
      tags:
      - вход
  /api/catalog/walk:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.walkStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Состояние обхода
      tags:
      - каталог
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.walkStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Собрать каталог
      tags:
      - каталог
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthResponse'
      summary: Проверка сервера
      tags:
      - сервер
  /api/parcels:
    get:
      description: Без краёв окна отдаёт весь город. С краями отдаёт только участки
        внутри прямоугольника. Это прорисовка «Экран» и «Близко».
      parameters:
      - description: Юг окна
        in: query
        name: south
        type: number
      - description: Запад окна
        in: query
        name: west
        type: number
      - description: Север окна
        in: query
        name: north
        type: number
      - description: Восток окна
        in: query
        name: east
        type: number
      - description: Упрощение линии, в градусах
        in: query
        name: simplify
        type: number
      - description: 1 — склеенные упрощённые контуры
        in: query
        name: squares
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.featureCollection'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Слой участков
      tags:
      - участки
  /api/parcels/{id}/quarter:
    get:
      parameters:
      - description: Идентификатор участка
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.quarterReport'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Квартал участка
      tags:
      - участки
  /api/parcels/at-point:
    post:
      consumes:
      - application/json
      parameters:
      - description: Широта и долгота
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/parcels.pointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.lookupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Участок по щелчку
      tags:
      - участки
  /api/parcels/stored:
    post:
      consumes:
      - application/json
      parameters:
      - description: Широта и долгота
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/parcels.pointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/parcels.lookupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/parcels.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/parcels.errorResponse'
      summary: Карточка из своей базы
      tags:
      - участки
swagger: "2.0"
